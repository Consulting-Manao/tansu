[package]
name = "tansu"
version = "3.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
tansu-executor = { path = "../tansu-executor" }
ed25519-dalek = "3.0.0"
sha2 = "0.11"
