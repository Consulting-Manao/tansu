name = "ipfs-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# What an account may have pinned in a day (src/quota.ts). Bindings are not
# inherited by environments: each one declares its own.
[[durable_objects.bindings]]
name = "UPLOAD_QUOTA"
class_name = "UploadQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UploadQuota"]

[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1000"
simple = { limit = 10, period = 60 }

[env.testnet]
[[env.testnet.routes]]
pattern = "ipfs-testnet.tansu.dev"
custom_domain = true

[env.testnet.vars]
NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
# Uploads must record their CID with this contract (deployments/tansu-testnet).
TANSU_CONTRACT_ID = "CBXKUSLQPVF35FYURR5C42BPYA5UOVDXX2ELKIM2CAJMCI6HXG2BHGZA"
# Checks txHash proofs.
SOROBAN_RPC_URL = "https://soroban-testnet.stellar.org"
# The largest CAR an upload may carry, in bytes (10 MB).
MAX_CAR_BYTES = "10485760"

[[env.testnet.durable_objects.bindings]]
name = "UPLOAD_QUOTA"
class_name = "UploadQuota"

# How often one address may ask for an upload (the namespace id is ours to pick,
# one per environment).
[[env.testnet.ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[env.testnet.migrations]]
tag = "v1"
new_sqlite_classes = ["UploadQuota"]

[env.production]
[[env.production.routes]]
pattern = "ipfs.tansu.dev"
custom_domain = true

[env.production.vars]
NETWORK_PASSPHRASE = "Public Global Stellar Network ; September 2015"
# Uploads must record their CID with this contract (deployments/tansu-mainnet).
TANSU_CONTRACT_ID = "CDXINK2T3P46M4LWK35FVIXXHJ2XHAS4FOVCGVPJ63YV5OVTM24IY5BI"
# Checks txHash proofs.
SOROBAN_RPC_URL = "https://rpc.lightsail.network/"
# The largest CAR an upload may carry, in bytes (10 MB).
MAX_CAR_BYTES = "10485760"

[[env.production.durable_objects.bindings]]
name = "UPLOAD_QUOTA"
class_name = "UploadQuota"

[[env.production.ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["UploadQuota"]

[observability]
enabled = true
