[workspace]
resolver = "2"
members = [
    "contracts/*",
]

[workspace.package]
authors = ["Consulting Manao GmbH"]
edition = "2024"
license = "BSD-3"
repository = "https://github.com/consulting-manao/tansu"

[workspace.dependencies]
soroban-sdk = { version = "26.0.0" }
# features = ["experimental_spec_shaking_v2"]

# Shared name-validation type extracted from the Stellar Registry contract.
# Used to validate/normalize project names now that the SorobanDomain
# integration has been removed.
stellar-registry-types = { git = "https://github.com/stellar-registry/contracts", rev = "2826467dbe9fb4741cca8d8ca21b0cc513f9dba8" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
