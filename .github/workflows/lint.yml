name: Linting

permissions:
  contents: read

on:
  # TODO adjust once we do PR
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  website-dapp:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DELEGATION_API_URL: "https://ipfs-testnet.tansu.dev"
      PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org:443"
      PUBLIC_SOROBAN_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      PUBLIC_STELLAR_REGISTRY_CONTRACT_ID: "CBFFTTX7QKA76FS4LHHQG54BC7JF5RMEX4RTNNJ5KEL76LYHVO3E3OEE"
      PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"
      PUBLIC_TANSU_CONTRACT_ID: "CTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"
      PUBLIC_TANSU_OWNER_ID: "GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Sync legal docs from root
        run: |
          cp legal/terms-of-service.md legal/privacy-policy.md legal/impressum.md website/static/legal/
          git diff --exit-code HEAD -- website/static/legal

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Get Bun cache directory
        id: bun-cache-dir
        run: echo "dir=$(bun pm cache)" >> ${GITHUB_OUTPUT}

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.bun-cache-dir.outputs.dir }}
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-lint-${{ hashFiles('**/package.json', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-lint-
            ${{ runner.os }}-bun-

      - name: Install website dependencies
        run: cd website && bun install --frozen-lockfile

      - name: Check MDX
        run: cd website && bun linter

      - name: Build website
        run: cd website && bun run build

      - name: Install App dependencies
        run: cd dapp && bun install --frozen-lockfile

      - name: Lint dApp
        run: cd dapp && bun run lint

      - name: Check dApp types
        run: cd dapp && bun run check

      - name: Unit test dApp
        run: cd dapp && bun run test:unit

      - name: Build app (static for lighthouse)
        run: cd dapp && bun run build:lighthouse

  ipfs-worker:
    name: IPFS upload worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dapp/workers/ipfs-delegation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Unit test
        run: bun run test
